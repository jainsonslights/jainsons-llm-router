[metadata]
name = jainsons-llm-router
version = 0.3.0
description = Policy-controlled, budget-aware in-process LLM routing for Jainsons services
long_description = file: README.md
long_description_content_type = text/markdown
license = Proprietary
author = Jainsons
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    jainsons-llm-router-sync-harness = jainsons_llm_router.sync_from_harness:main
